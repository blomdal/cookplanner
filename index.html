    :root {
      --bg-page: #FAF9F0;
      --bg-tile: #F2EFE1;
      --bg-dark: #E0DDCA;
      --border: #E0DDCA;
      --text-primary: #513620;
      --text-secondary: #8C7462;
      --positive: #0EA543;
      --warn: #CAB20A;
      --negative: #F64C14;
      --font: 'Geigy', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg-page);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--bg-dark);
      color: #513620;
      border-bottom: 2px solid #513620;
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-left h1 { font-size: 27px; font-weight: 700; letter-spacing: -0.01em; font-family: 'Serrif Compressed', system-ui, -apple-system, sans-serif; }
    .header-left p  { font-size: 12px; color: rgba(81,54,32,0.6); margin-top: 2px; }
    .header-actions { display: flex; gap: 8px; flex-shrink: 0; }

    /* ── Buttons ── */
    .btn {
      padding: 8px 14px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      line-height: 1;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .82; }
    .btn-primary  { background: #F7FE28; color: #513620; }
    .btn-ghost    { background: #FAF9F0; color: var(--text-primary); border: 1px solid var(--border); }
    .btn-dark     { background: #F7FE28; color: #513620; }
    .btn-icon     { background: transparent; border: none; cursor: pointer; color: var(--text-secondary); font-size: 16px; line-height: 1; padding: 2px 5px; border-radius: 4px; }
    .btn-icon:hover { color: var(--negative); background: #fff3f5; }

    /* ── Layout ── */
    .main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 60px; }
    .section-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .09em;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    /* ── Team cards ── */
    .team-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 10px;
      margin-bottom: 36px;
    }
    .team-card {
      background: var(--bg-tile);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }
    .team-card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .team-card-name { font-size: 13px; font-weight: 700; }
    .disc-badges { display: flex; flex-wrap: wrap; gap: 4px; margin: 7px 0 10px; }
    .disc-badge {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 99px;
    }
    .d-Design     { background: #FEC1C7; color: #513620; }
    .d-Engineering{ background: #C8DEFF; color: #1A4D9A; }
    .d-Product    { background: #F7FE28; color: #513620; }
    .d-Data       { background: #B8EDCB; color: #0A6B2E; }

    .cap-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
    .cap-fill  { height: 100%; border-radius: 3px; transition: width .3s; }
    .cap-labels { display: flex; justify-content: space-between; margin-top: 4px; font-size: 11px; color: var(--text-secondary); }
    .cap-remaining { font-weight: 700; }
    .cap-ok   { color: var(--positive); }
    .cap-warn { color: var(--warn); }
    .cap-over { color: var(--negative); }

    .add-tile {
      border: 1.5px dashed #513620;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      min-height: 90px;
      transition: all .15s;
    }
    .add-tile:hover { border-color: #513620; color: #513620; background: rgba(81,54,32,0.08); }

    /* ── Projects ── */
    .projects-stack { display: flex; flex-direction: column; gap: 14px; margin-bottom: 12px; }

    .project-card {
      background: var(--bg-tile);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .project-card.flagged {
      border: 2px solid #F64C14;
      box-shadow: 0 2px 10px rgba(246,76,20,0.18);
    }
    .flag-badge {
      font-size: 10px; font-weight: 700; font-family: 'Geigy Mono', monospace;
      background: #F64C14; color: #fff; padding: 2px 7px; border-radius: 4px;
      letter-spacing: .05em; white-space: nowrap;
    }
    .btn-flag { background: none; border: none; cursor: pointer; font-size: 16px; line-height: 1; padding: 4px 6px; border-radius: 5px; color: #B9B49E; }
    .btn-flag:hover { color: #F64C14; background: rgba(246,76,20,0.08); }
    .btn-flag.on { color: #F64C14; }
    .project-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .proj-num {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      color: white;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .proj-meta { flex: 1; min-width: 0; }
    .proj-name { font-size: 14px; font-weight: 700; }
    .proj-desc { font-size: 12px; color: var(--text-secondary); margin-top: 3px; line-height: 1.4; }
    .project-header-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .project-body { padding: 14px 16px; }
    .sub-label {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }


    /* Assignments table */
    .assign-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .assign-table th {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-secondary);
      padding: 5px 8px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .assign-table td {
      padding: 8px 8px;
      font-size: 13px;
      border-bottom: 1px solid #f0ede8;
      vertical-align: middle;
    }
    .assign-table tr:last-child td { border-bottom: none; }
    .assign-table th:nth-child(1), .assign-table td:nth-child(1) { width: 22%; }
    .assign-table th:nth-child(2), .assign-table td:nth-child(2) { width: 10%; }
    .assign-table th:nth-child(3), .assign-table td:nth-child(3) { width: auto; }
    .assign-table th:nth-child(4), .assign-table td:nth-child(4) { width: 36px; }
    .person-name-cell strong { font-size: 13px; }
    .person-sub { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }
    .week-pip-row { display: flex; gap: 6px; width: 100%; }
    .week-pip {
      flex: 1;
      height: 28px;
      border-radius: 5px;
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }
    .week-pip.on { border: none; color: #513620; }

    .empty-assign { font-size: 12px; color: var(--text-secondary); padding: 8px 0; }

    /* Add project */
    .add-project-row {
      border: 1.5px dashed #513620;
      border-radius: 10px;
      padding: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: var(--text-secondary);
      font-size: 13px;
      cursor: pointer;
      transition: all .15s;
      margin-bottom: 36px;
    }
    .add-project-row:hover { border-color: #513620; color: #513620; background: rgba(81,54,32,0.08); }

    /* ── Timeline ── */
    .timeline-wrap {
      background: var(--bg-tile);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      overflow-x: auto;
    }
    .timeline-table { width: 100%; border-collapse: collapse; min-width: 540px; }
    .timeline-table th {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      padding: 10px 12px;
      text-align: center;
      border-bottom: 1px solid var(--border);
      background: #EDE9DC;
    }
    .timeline-table th.name-col { text-align: left; min-width: 150px; }
    .timeline-table td {
      padding: 8px 12px;
      border-bottom: 1px solid #f0ede8;
      text-align: center;
      vertical-align: middle;
    }
    .timeline-table td.name-col { text-align: left; }
    .timeline-table tr:last-child td { border-bottom: none; }
    .tl-person-name { font-size: 13px; font-weight: 600; }
    .tl-person-disc { font-size: 11px; color: var(--text-secondary); margin-top: 1px; }
    .tl-cell { display: flex; flex-wrap: wrap; gap: 3px; justify-content: flex-start; align-items: center; min-height: 28px; }
    .tl-chip {
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      color: white;
      letter-spacing: .01em;
    }
    .tl-empty { color: #D9D9D9; font-size: 13px; }

    /* ── Modals ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(44,19,26,.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .modal {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      width: 440px;
      max-width: 92vw;
      max-height: 88vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(44,19,26,.18);
    }
    .modal h2 { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
    .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--border); }

    /* Form */
    .fg { margin-bottom: 16px; }
    .fg label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .fi {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-family: var(--font);
      font-size: 14px;
      color: var(--text-primary);
      background: #fff;
    }
    .fi:focus { outline: none; border-color: #DE5D83; box-shadow: 0 0 0 3px rgba(222,93,131,.1); }
    textarea.fi { resize: vertical; min-height: 72px; }
    select.fi { cursor: pointer; }

    .disc-toggle-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .disc-toggle {
      padding: 6px 13px;
      border-radius: 99px;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--text-secondary);
      font-family: var(--font);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all .12s;
    }
    .disc-toggle.sel-Design     { background: #FEC1C7; border-color: #F64C14; color: #513620; }
    .disc-toggle.sel-Engineering{ background: #C8DEFF; border-color: #4295FF; color: #1A4D9A; }
    .disc-toggle.sel-Product    { background: #F7FE28; border-color: #CAB20A; color: #513620; }
    .disc-toggle.sel-Data       { background: #B8EDCB; border-color: #0EA543; color: #0A6B2E; }

    .week-toggle-row { display: flex; gap: 6px; }
    .week-toggle {
      width: 38px; height: 38px;
      border-radius: 7px;
      border: 1.5px solid var(--border);

      border-radius: 7px;

    /* Reset button */

    /* Legend */

    .legend-dot { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<!-- ═══════════════════ LANDING ═══════════════════ -->
<div id="landing" style="display:none; min-height:100vh; background:#FAF9F0; font-family:'Geigy',system-ui,sans-serif;">
  <div style="max-width:680px; margin:0 auto; padding:64px 24px;">
    <h1 style="font-family:'Serrif Compressed',system-ui,serif; font-size:36px; color:#513620; margin-bottom:6px;">Cook Period Planner</h1>

    <div id="boards-list" style="display:flex; flex-direction:column; gap:10px; margin-bottom:24px;"></div>

    <div style="border-top:1px solid #E0DDCA; padding-top:24px; display:flex; gap:10px; align-items:center;">
      <input id="new-board-name" class="fi" type="text" placeholder="New board name, e.g. Food Tech" style="flex:1; max-width:320px;" onkeydown="if(event.key==='Enter')createBoard()">
      <button class="btn btn-primary" onclick="createBoard()">+ Create board</button>

<!-- ═══════════════════ HEADER ═══════════════════ -->

<!-- ═══════════════════ SCRIPT ═══════════════════ -->
<script>
  // ════════════════════════════════════════════
  // SUPABASE CONFIG — paste your values here
  // ════════════════════════════════════════════
  const SUPABASE_URL      = 'https://bjootsvzrqvqnrpnnscg.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_Ad3VDuPjeJZIdf9hTW3Beg_k86NOEcQ';
  // ════════════════════════════════════════════

  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  function setSyncStatus(msg, ok = true) {
    const el = document.getElementById('sync-status');
    if (el) { el.textContent = msg; el.style.color = ok ? 'rgba(81,54,32,0.5)' : '#F64C14'; }
  }

  // ── Constants ──
  const HOURS_PER_DAY  = 7.5;
  const DAYS_PER_WEEK  = 5;
  const PROJ_COLORS = [
    '#4295FF', // Water
    '#0EA543', // Broccoli
    '#F64C14', // Chili
    '#954505', // Cinnamon
    '#B85B10', // Chocolate
    '#513620', // Brown
    '#CAB20A', // Mustard (use Brown text)
    '#F7FE28', // Delightful (use Brown text)
  ];
  const PROJ_TEXT = [
    '#fff','#fff','#fff','#fff',
    '#fff','#fff','#513620','#513620'
  ];

  // ── State ──
  let state = { team: [], projects: [] };
  let currentBoardId   = null;
  let currentBoardName = '';
  let _realtimeChannel = null;

  let editMemberId      = null;
  let editProjectId     = null;
  let assignToProjectId = null;
  let editAssignmentId  = null;
  let _isSaving         = false;

  // ── Persistence ──
  async function save() {
    if (!currentBoardId) return;
    _isSaving = true;
    const { error } = await _supabase
      .from('planner_state')
      .upsert({ id: currentBoardId, state, updated_at: new Date().toISOString() });
    if (error) { setSyncStatus('save error', false); console.error(error); }
    else { setSyncStatus('saved ✓'); }
    setTimeout(() => { _isSaving = false; }, 300);
  }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,5); }

  // ── Landing screen ──
  async function showLanding() {
    document.getElementById('landing').style.display = 'block';
    document.getElementById('main-header').style.display = 'none';
    document.getElementById('main-content').style.display = 'none';
    if (_realtimeChannel) { _supabase.removeChannel(_realtimeChannel); _realtimeChannel = null; }
    currentBoardId = null;

    const listEl = document.getElementById('boards-list');
    listEl.innerHTML = '<p style="font-size:13px;color:#8C7462;">Loading boards…</p>';
    const { data, error } = await _supabase.from('boards').select('*').order('created_at');
    if (error || !data.length) {
      listEl.innerHTML = '<p style="font-size:13px;color:#8C7462;">No boards yet — create one below.</p>';
      return;
    }
    listEl.innerHTML = data.map(b => `
      <div style="background:#F2EFE1;border:1px solid #E0DDCA;border-radius:10px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;transition:background .15s;" onmouseover="this.style.background='#E0DDCA'" onmouseout="this.style.background='#F2EFE1'">
        <span onclick="enterBoard('${b.id}','${esc(b.name)}')" style="font-size:15px;font-weight:600;color:#513620;cursor:pointer;flex:1;">${esc(b.name)}</span>
        <div style="display:flex;align-items:center;gap:12px;">
          <span onclick="enterBoard('${b.id}','${esc(b.name)}')" style="font-size:12px;color:#8C7462;cursor:pointer;">Open →</span>
          <button onclick="event.stopPropagation();deleteBoard('${b.id}','${esc(b.name)}')" style="background:none;border:none;cursor:pointer;font-size:16px;color:#8C7462;line-height:1;padding:2px 4px;border-radius:4px;" title="Delete board" onmouseover="this.style.color='#F64C14'" onmouseout="this.style.color='#8C7462'">&#215;</button>
        </div>
      </div>`).join('');
  }

  async function deleteBoard(id, name) {
    if (!confirm(`Delete "${name}"? This will permanently remove the board and all its data.`)) return;
    await _supabase.from('planner_state').delete().eq('id', id);
    await _supabase.from('boards').delete().eq('id', id);
    showLanding();
  }

  async function createBoard() {
    const name = document.getElementById('new-board-name').value.trim();
    if (!name) { document.getElementById('new-board-name').focus(); return; }
    const { data, error } = await _supabase.from('boards').insert({ name }).select().single();
    if (error) { alert('Could not create board. Try again.'); return; }
    document.getElementById('new-board-name').value = '';
    enterBoard(data.id, data.name);
  }

  async function enterBoard(id, name) {
    currentBoardId   = id;
    currentBoardName = name;
    document.getElementById('landing').style.display = 'none';
    document.getElementById('main-header').style.display = 'block';
    document.getElementById('main-content').style.display = 'block';
    document.getElementById('board-name-label').textContent = name;
    await loadState();
  }

  // ── Load board state from Supabase ──
  async function loadState() {
    setSyncStatus('connecting…');
    const { data, error } = await _supabase
      .from('planner_state')
      .select('state')
      .eq('id', currentBoardId)
      .single();
    if (error) {
      state = { team: [], projects: [] };
      setSyncStatus('live ●');
    } else {
      state = data.state || { team: [], projects: [] };
      setSyncStatus('live ●');
    }
    render();
    subscribeRealtime();
  }

  // ── Real-time subscription ──
  function subscribeRealtime() {
    if (_realtimeChannel) _supabase.removeChannel(_realtimeChannel);
    _realtimeChannel = _supabase
      .channel('planner-' + currentBoardId)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'planner_state', filter: `id=eq.${currentBoardId}` }, payload => {
        if (_isSaving) return;
        state = payload.new.state || { team: [], projects: [] };
        setSyncStatus('synced ●');
        render();
      })
      .subscribe();
  }

  // ─────────────────────────────────────────────
  // RENDER
  // ─────────────────────────────────────────────
  function getCookWeeks() { return state.cookWeeks || 6; }
  function getStartWeek() { return state.startWeek || getCurrentISOWeek(); }

  function getCurrentISOWeek() {
    const d = new Date();
    d.setHours(0,0,0,0);
    d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
    const week1 = new Date(d.getFullYear(), 0, 4);
    return 1 + Math.round(((d - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
  }

  function populateStartWeekDropdown() {
    const sel = document.getElementById('start-week-select');
    if (!sel) return;
    const current = getStartWeek();
    sel.innerHTML = Array.from({length: 52}, (_, i) => i + 1)
      .map(w => `<option value="${w}" ${w === current ? 'selected' : ''}>W${w}</option>`)
      .join('');
    sel.value = current;
    const label = document.getElementById('start-week-label');
    if (label) label.textContent = 'W' + current;
  }

  async function setCookWeeks(val) {
    state.cookWeeks = parseInt(val);
    await save();
    render();
  }

  async function setStartWeek(val) {
    state.startWeek = parseInt(val);
    await save();
    render();
  }

  function renderWeekToggles(selectedWeeks = []) {
    const n = getCookWeeks();
    const startW = getStartWeek();
    const row = document.getElementById('week-toggle-row');
    if (!row) return;
    row.innerHTML = Array.from({length: n}, (_, i) => i + 1).map(w => {
      const wNum = ((startW + w - 2) % 52) + 1;
      return `<button class="week-toggle${selectedWeeks.includes(w) ? ' sel' : ''}" data-w="${w}" onclick="toggleWeek(this)">W${wNum}</button>`;
    }).join('');
  }

  function render() {
    const cookW = getCookWeeks();
    const sel = document.getElementById('cook-weeks-select');
    if (sel) sel.value = cookW;
    const cookLabel = document.getElementById('cook-weeks-label');
    if (cookLabel) cookLabel.textContent = cookW + ' weeks';
    populateStartWeekDropdown();
    renderTeam();
    renderProjects();
    renderTimeline();
  }

  function allocatedDays(personId) {
    return state.projects.reduce((sum, p) =>
      sum + (p.assignments||[]).filter(a=>a.personId===personId).reduce((s,a)=>s+(parseFloat(a.days)||0),0)
    , 0);
  }

  // ── Team ──
  function renderTeam() {
    const grid = document.getElementById('team-grid');
    let html = '';
    state.team.forEach(m => {
      const availWeeks = m.availableWeeks || 6;
      const totalDays  = availWeeks * DAYS_PER_WEEK;
      const alloc      = allocatedDays(m.id);
      const rem        = totalDays - alloc;
      const allocPct   = Math.min(100, (alloc / totalDays) * 100);
      const remPct     = Math.max(0, 100 - allocPct);
      const barColor   = allocPct >= 100 ? 'var(--negative)' : allocPct >= 80 ? 'var(--warn)' : 'var(--positive)';
      const remCls     = allocPct >= 100 ? 'cap-over' : allocPct >= 80 ? 'cap-warn' : 'cap-ok';
      const pct        = remPct;
      const badges     = (m.disciplines||[]).map(d=>`<span class="disc-badge d-${d}">${d}</span>`).join('');
      const remLabel   = rem % 1 === 0 ? rem+'d' : rem.toFixed(1)+'d';
      const allocLabel = alloc % 1 === 0 ? alloc+'d' : alloc.toFixed(1)+'d';
      html += `
        <div class="team-card">
          <div class="team-card-top">
            <div class="team-card-name">${esc(m.name)}</div>
            <div style="display:flex;gap:2px;">
              <button class="btn-icon" title="Edit" onclick="openEditMember('${m.id}')">&#9998;</button>
              <button class="btn-icon" title="Remove" onclick="removeMember('${m.id}')">&#215;</button>
            </div>
          </div>
          <div class="disc-badges">${badges||'<span style="font-size:11px;color:#ccc;">No disciplines</span>'}</div>
          <div style="font-size:11px;color:var(--text-secondary);margin-bottom:7px;">${availWeeks} week${availWeeks!==1?'s':''} &middot; ${totalDays}d total</div>
          <div class="cap-track"><div class="cap-fill" style="width:${pct}%;background:${barColor}"></div></div>
          <div class="cap-labels">
            <span class="cap-remaining ${remCls}">${remLabel} left</span>
            <span>${allocLabel} allocated</span>
          </div>
        </div>`;
    });
    html += `<div class="add-tile" onclick="openMemberModal()"><span style="font-size:18px;opacity:.5;">+</span> Add person</div>`;
    grid.innerHTML = html;
  }

  // ── Projects ──
  function renderProjects() {
    const stack = document.getElementById('projects-stack');
    if (!state.projects.length) { stack.innerHTML=''; return; }

    let html = '';
    state.projects.forEach((proj, idx) => {
      const color     = PROJ_COLORS[idx % PROJ_COLORS.length];
      const colorText = PROJ_TEXT[idx % PROJ_TEXT.length];


      // — Assignments —
      const assigns = proj.assignments||[];
      let assignHtml = '';
      if (assigns.length) {
        const rows = assigns.map(a => {
          const person = state.team.find(m=>m.id===a.personId);
          if (!person) return '';
          const cookW = getCookWeeks();
          const startW = getStartWeek();
          const pips = Array.from({length: cookW}, (_, i) => i + 1).map(w => {
            const on = (a.weeks||[]).includes(w);
            const wNum = ((startW + w - 2) % 52) + 1;
            return `<div class="week-pip ${on?'on':''}" style="${on?'background:#F7FE28;color:#513620':''}">
              ${on ? 'W'+wNum : ''}
            </div>`;
          }).join('');
          const days = parseFloat(a.days)||0;
          const dLabel = days % 1 === 0 ? days+'d' : days.toFixed(1)+'d';
          const hLabel = (days * HOURS_PER_DAY) % 1 === 0 ? (days * HOURS_PER_DAY)+'h' : (days * HOURS_PER_DAY).toFixed(1)+'h';
          const expectedDays = (a.weeks||[]).length * DAYS_PER_WEEK;
          const mismatch = days > 0 && (a.weeks||[]).length > 0 && days > expectedDays;
          const mismatchBadge = mismatch
            ? `<span title="${(a.weeks||[]).length} week${(a.weeks||[]).length>1?'s':''} can hold max ${expectedDays}d, but ${days}d entered" style="display:inline-block;margin-left:5px;background:#CAB20A;color:#513620;font-size:10px;font-weight:700;border-radius:4px;padding:1px 5px;cursor:default;">⚠ +${days - expectedDays}d</span>`
            : '';
          return `<tr>
            <td class="person-name-cell">
              <strong>${esc(person.name)}</strong>
              <div class="person-sub">${(person.disciplines||[]).join(' · ')||'—'}</div>
            </td>
            <td>
              <strong>${dLabel}</strong>${mismatchBadge}
              <div style="font-size:11px;color:var(--text-secondary);">${hLabel}</div>
            </td>
            <td><div class="week-pip-row">${pips}</div></td>
            <td style="text-align:right;white-space:nowrap;">
              <button class="btn-icon" title="Edit" onclick="openEditAssignment('${proj.id}','${a.id}')">&#9998;</button>
              <button class="btn-icon" title="Remove" onclick="removeAssignment('${proj.id}','${a.id}')">&#215;</button>
            </td>
          </tr>`;
        }).join('');
        assignHtml = `<table class="assign-table">
          <thead><tr><th>Person</th><th>Days</th><th>Weeks</th><th></th></tr></thead>
          <tbody>${rows}</tbody>
        </table>`;
      } else {
        assignHtml = '<div class="empty-assign">No assignments yet</div>';
      }

      html += `
        <div class="project-card${proj.flagged ? ' flagged' : ''}">
          <div class="project-header">
            <div class="proj-num" style="${proj.flagged ? 'background:#F64C14;color:#fff' : 'background:#F7FE28;color:#513620'}">${idx+1}</div>
            <div class="proj-meta">
              <div style="display:flex;align-items:center;gap:8px;">
                <div class="proj-name">${esc(proj.name)}</div>
                ${proj.flagged ? '<span class="flag-badge">&#9873; PRIORITY</span>' : ''}
                ${proj.size ? `<span style="font-size:10px;font-weight:700;font-family:'Geigy Mono',monospace;background:#E0DDCA;color:#513620;padding:2px 7px;border-radius:4px;letter-spacing:.05em;">${proj.size}</span>` : ''}
              </div>
              ${(() => { const owner = proj.ownerId ? state.team.find(m=>m.id===proj.ownerId) : null; return owner ? `<div style="font-size:11px;color:var(--text-secondary);margin-top:3px;">Owner: <strong style="color:var(--text-primary);">${esc(owner.name)}</strong></div>` : ''; })()}
              ${proj.description ? `<div class="proj-desc">${esc(proj.description)}</div>` : ''}
            </div>
            <div class="project-header-actions">
              <button class="btn-flag${proj.flagged ? ' on' : ''}" title="${proj.flagged ? 'Remove priority flag' : 'Flag as priority'}" onclick="toggleFlag('${proj.id}')">&#9873;</button>
              <button class="btn btn-ghost" style="font-size:12px;padding:5px 10px;" onclick="openEditProject('${proj.id}')">Edit</button>
              <button class="btn-icon" onclick="removeProject('${proj.id}')">&#215;</button>
            </div>
          </div>
          <div class="project-body">
            <div class="sub-label">Assignees</div>
            ${assignHtml}
            <button class="btn btn-ghost" style="margin-top:10px;font-size:12px;padding:5px 12px;" onclick="openAssignModal('${proj.id}')">+ Add assignee</button>
          </div>
        </div>`;
    });
    stack.innerHTML = html;
  }

  // ── Timeline ──
  function renderTimeline() {
    const tbody   = document.getElementById('timeline-body');
    const thead   = document.getElementById('timeline-head');
    const legendEl = document.getElementById('legend-row');

    // Cook period length — set by the user, not driven by individual availability
    const maxWeeks = state.cookWeeks || 6;

    // Rebuild header columns
    const startW = getStartWeek();
    let headHtml = '<th class="name-col">Person</th>';
    for (let w = 1; w <= maxWeeks; w++) {
      const wNum = ((startW + w - 2) % 52) + 1;
      headHtml += `<th>W${wNum}</th>`;
    }
    thead.innerHTML = headHtml;

    // Legend
    let legendHtml = '';
    state.projects.forEach((p, idx) => {
      legendHtml += `<div class="legend-item"><div class="legend-dot" style="background:#F7FE28;outline:1px solid #E0DDCA"></div>P${idx+1}: ${esc(p.name)}</div>`;
    });
    legendEl.innerHTML = legendHtml;

    if (!state.team.length) {
      tbody.innerHTML = `<tr><td colspan="${maxWeeks + 1}" style="text-align:center;color:var(--text-secondary);font-size:13px;padding:24px;">Add team members to see the timeline</td></tr>`;
      return;
    }

    let html = '';
    state.team.forEach(member => {
      let cells = '';
      for (let w = 1; w <= maxWeeks; w++) {
        let chips = '';
        state.projects.forEach((proj, idx) => {
          (proj.assignments||[]).forEach(a => {
            if (a.personId === member.id && (a.weeks||[]).includes(w)) {
              chips += `<div class="tl-chip" style="background:#F7FE28;color:#513620">P${idx+1}</div>`;
            }
          });
        });
        cells += `<td><div class="tl-cell">${chips || '<span class="tl-empty">—</span>'}</div></td>`;
      }
      html += `<tr>
        <td class="name-col">
          <div class="tl-person-name">${esc(member.name)}</div>
          <div class="tl-person-disc">${(member.disciplines||[]).join(' · ')||'—'}</div>
        </td>${cells}
      </tr>`;
    });
    tbody.innerHTML = html;
  }

  // ─────────────────────────────────────────────
  // MEMBER ACTIONS
  // ─────────────────────────────────────────────
  function setAvailWeeksUI(weeks) {
    document.querySelectorAll('.avail-btn').forEach(b => {
      b.classList.toggle('sel', parseInt(b.dataset.w) === weeks);
    });
  }

  function selectAvailWeeks(btn) {
    document.querySelectorAll('.avail-btn').forEach(b => b.classList.remove('sel'));
    btn.classList.add('sel');
  }

  function getSelectedAvailWeeks() {
    const sel = document.querySelector('.avail-btn.sel');
    return sel ? parseInt(sel.dataset.w) : 6;
  }

  function openMemberModal() {
    editMemberId = null;
    document.getElementById('modal-member-title').textContent = 'Add Team Member';
    document.getElementById('m-name').value = '';
    document.querySelectorAll('.disc-toggle').forEach(b => b.className = 'disc-toggle');
    setAvailWeeksUI(6);
    document.getElementById('modal-member').style.display = 'flex';
    setTimeout(() => document.getElementById('m-name').focus(), 50);
  }

  function openEditMember(id) {
    editMemberId = id;
    const m = state.team.find(x=>x.id===id);
    document.getElementById('modal-member-title').textContent = 'Edit Team Member';
    document.getElementById('m-name').value = m.name;
    document.querySelectorAll('.disc-toggle').forEach(b => {
      const d = b.dataset.d;
      b.className = 'disc-toggle' + ((m.disciplines||[]).includes(d) ? ` sel-${d}` : '');
    });
    setAvailWeeksUI(m.availableWeeks || 6);
    document.getElementById('modal-member').style.display = 'flex';
    setTimeout(() => document.getElementById('m-name').focus(), 50);
  }

  function toggleMemberDisc(btn) {
    const d = btn.dataset.d;
    btn.className = btn.className.includes(`sel-${d}`) ? 'disc-toggle' : `disc-toggle sel-${d}`;
  }

  function saveMember() {
    const name = document.getElementById('m-name').value.trim();
    if (!name) { document.getElementById('m-name').focus(); return; }
    const disciplines    = Array.from(document.querySelectorAll('#modal-member .disc-toggle'))
      .filter(b=>b.className.includes('sel-'))
      .map(b=>b.dataset.d);
    const availableWeeks = getSelectedAvailWeeks();

    if (editMemberId) {
      const m = state.team.find(x=>x.id===editMemberId);
      m.name = name; m.disciplines = disciplines; m.availableWeeks = availableWeeks;
    } else {
      state.team.push({ id: uid(), name, disciplines, availableWeeks });
    }
    save(); render();
    closeModal('modal-member');
  }

  function removeMember(id) {
    if (!confirm('Remove this team member? Their assignments will also be removed.')) return;
    state.team = state.team.filter(m=>m.id!==id);
    state.projects.forEach(p => { p.assignments = (p.assignments||[]).filter(a=>a.personId!==id); });
    save(); render();
  }

  // ─────────────────────────────────────────────
  // PROJECT ACTIONS
  // ─────────────────────────────────────────────
  function openProjectModal() {
    editProjectId = null;
    document.getElementById('modal-project-title').textContent = 'Add Project';
    document.getElementById('save-proj-btn').textContent = 'Add Project';
    document.getElementById('p-name').value = '';
    document.getElementById('p-desc').value = '';
    document.getElementById('p-size').value = '';
    populateOwnerDropdown();
    document.getElementById('p-owner').value = '';
    document.getElementById('modal-project').style.display = 'flex';
    setTimeout(() => document.getElementById('p-name').focus(), 50);
  }

  function openEditProject(id) {
    editProjectId = id;
    const p = state.projects.find(x=>x.id===id);
    document.getElementById('modal-project-title').textContent = 'Edit Project';
    document.getElementById('save-proj-btn').textContent = 'Save';
    document.getElementById('p-name').value = p.name;
    document.getElementById('p-desc').value = p.description||'';
    document.getElementById('p-size').value = p.size||'';
    populateOwnerDropdown();
    document.getElementById('p-owner').value = p.ownerId||'';
    document.getElementById('modal-project').style.display = 'flex';
    setTimeout(() => document.getElementById('p-name').focus(), 50);
  }

  function saveProject() {
    const name = document.getElementById('p-name').value.trim();
    if (!name) { document.getElementById('p-name').focus(); return; }
    const description = document.getElementById('p-desc').value.trim();
    const size        = document.getElementById('p-size').value;
    const ownerId     = document.getElementById('p-owner').value;

    if (editProjectId) {
      const p = state.projects.find(x=>x.id===editProjectId);
      p.name = name; p.description = description; p.size = size; p.ownerId = ownerId;
    } else {
      state.projects.push({ id: uid(), name, description, size, ownerId, disciplinesNeeded: [], assignments: [] });
    }
    save(); render();
    closeModal('modal-project');
  }

  function toggleFlag(id) {
    const p = state.projects.find(x=>x.id===id);
    if (!p) return;
    if (!p.flagged) {
      const flaggedCount = state.projects.filter(x=>x.flagged).length;
      if (flaggedCount >= 3) { alert('Max 3 flagged projects per board. Unflag one first.'); return; }
      p.flagged = true;
      // Move to front: flagged project becomes #1
      state.projects = [p, ...state.projects.filter(x=>x.id!==id)];
    } else {
      delete p.flagged;
      // Re-group: remaining flagged stay on top, this project goes right below them
      const flagged   = state.projects.filter(x=>x.flagged);
      const unflagged = state.projects.filter(x=>!x.flagged && x.id!==id);
      state.projects = [...flagged, p, ...unflagged];
    }
    save(); render();
  }

  function removeProject(id) {
    if (!confirm('Remove this project and all its assignments?')) return;
    state.projects = state.projects.filter(p=>p.id!==id);
    save(); render();
  }

  // ─────────────────────────────────────────────
  // ASSIGNMENT ACTIONS
  // ─────────────────────────────────────────────
  function openAssignModal(projId) {
    if (!state.team.length) { alert('Add team members first.'); return; }
    assignToProjectId = projId;
    editAssignmentId  = null;

    const sel = document.getElementById('a-person');
    sel.innerHTML = state.team.map(m =>
      `<option value="${m.id}">${esc(m.name)}${m.disciplines.length ? ' ('+m.disciplines.join(', ')+')' : ''}</option>`
    ).join('');
    sel.disabled = false;
    updatePersonCapacityHint();

    const daysInput = document.getElementById('a-days');
    daysInput.value = '';
    document.getElementById('a-days-hint').textContent = '= — h (7.5 h/day)';
    document.getElementById('a-mismatch-warn').style.display = 'none';
    renderWeekToggles([]);
    document.getElementById('modal-assign-title').textContent = 'Add Assignee';
    document.getElementById('save-assign-btn').textContent = 'Add';
    document.getElementById('modal-assign').style.display = 'flex';
    setTimeout(() => daysInput.focus(), 50);
  }

  function openEditAssignment(projId, assignId) {
    if (!state.team.length) return;
    assignToProjectId = projId;
    editAssignmentId  = assignId;

    const proj = state.projects.find(x=>x.id===projId);
    const a    = (proj.assignments||[]).find(x=>x.id===assignId);
    if (!a) return;

    const sel = document.getElementById('a-person');
    sel.innerHTML = state.team.map(m =>
      `<option value="${m.id}">${esc(m.name)}${m.disciplines.length ? ' ('+m.disciplines.join(', ')+')' : ''}</option>`
    ).join('');
    sel.value    = a.personId;
    sel.disabled = true;
    updatePersonCapacityHint();

    const days = parseFloat(a.days)||0;
    const daysInput = document.getElementById('a-days');
    daysInput.value = days;
    document.getElementById('a-days-hint').textContent = days
      ? `= ${(days * HOURS_PER_DAY) % 1 === 0 ? days * HOURS_PER_DAY : (days * HOURS_PER_DAY).toFixed(1)} h (7.5 h/day)`
      : '= — h (7.5 h/day)';

    renderWeekToggles(a.weeks||[]);

    document.getElementById('modal-assign-title').textContent = 'Edit Assignee';
    document.getElementById('save-assign-btn').textContent = 'Save';
    document.getElementById('modal-assign').style.display = 'flex';
    updateMismatchWarning();
    setTimeout(() => daysInput.focus(), 50);
  }


  function updateMismatchWarning() {
    const days     = parseFloat(document.getElementById('a-days').value) || 0;
    const selWeeks = document.querySelectorAll('.week-toggle.sel').length;
    const warn     = document.getElementById('a-mismatch-warn');
    const capacity = selWeeks * DAYS_PER_WEEK;
    // Only warn if days exceed what the selected weeks can hold (impossible schedule)
    if (days > 0 && selWeeks > 0 && days > capacity) {
      warn.style.display = 'block';
      warn.textContent = `⚠ ${selWeeks} week${selWeeks > 1 ? 's' : ''} can hold max ${capacity}d at full capacity, but you entered ${days}d.`;
    } else {
      warn.style.display = 'none';
    }
  }

  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('a-days').addEventListener('input', function() {
      const d = parseFloat(this.value);
      const hint = document.getElementById('a-days-hint');
      hint.textContent = isNaN(d) || d === 0
        ? '= — h (7.5 h/day)'
        : `= ${(d * HOURS_PER_DAY) % 1 === 0 ? d * HOURS_PER_DAY : (d * HOURS_PER_DAY).toFixed(1)} h (7.5 h/day)`;
      updateMismatchWarning();
    });
  });

  function toggleWeek(btn) { btn.classList.toggle('sel'); updateMismatchWarning(); }

  function populateOwnerDropdown() {
    const sel = document.getElementById('p-owner');
    const current = sel.value;
    sel.innerHTML = '<option value="">— No owner —</option>' +
      state.team.map(m => `<option value="${m.id}">${esc(m.name)}</option>`).join('');
    sel.value = current;
  }

  function updatePersonCapacityHint() {
    const personId = document.getElementById('a-person').value;
    const hint = document.getElementById('a-person-hint');
    if (!hint) return;
    const person = state.team.find(m => m.id === personId);
    if (!person) { hint.textContent = ''; return; }
    const totalDays = (person.availableWeeks || getCookWeeks()) * DAYS_PER_WEEK;
    hint.textContent = `${person.name} has ${totalDays}d total this cook`;
  }

  function saveAssignment() {
    const personId = document.getElementById('a-person').value;
    const days     = parseFloat(document.getElementById('a-days').value) || 0;
    const weeks    = Array.from(document.querySelectorAll('.week-toggle.sel')).map(b=>parseInt(b.dataset.w));
    if (!personId) return;
    const p = state.projects.find(x=>x.id===assignToProjectId);
    if (!p.assignments) p.assignments = [];
    if (editAssignmentId) {
      const a = p.assignments.find(x=>x.id===editAssignmentId);
      if (a) { a.days = days; a.weeks = weeks; }
    } else {
      p.assignments.push({ id: uid(), personId, days, weeks });
    }
    save(); render();
    closeModal('modal-assign');
  }

  function removeAssignment(projId, assignId) {
    const p = state.projects.find(x=>x.id===projId);
    p.assignments = (p.assignments||[]).filter(a=>a.id!==assignId);
    save(); render();
  }

  // ─────────────────────────────────────────────
  // MODAL HELPERS
  // ─────────────────────────────────────────────
  function closeModal(id) { document.getElementById(id).style.display = 'none'; }
  function overlayClose(e, id) { if (e.target === e.currentTarget) closeModal(id); }

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      ['modal-member','modal-project','modal-assign'].forEach(closeModal);
    }
  });

  // ─────────────────────────────────────────────
  // CAPTURE IMAGE
  // ─────────────────────────────────────────────
  function captureImage(btn) {
    const original = btn.innerHTML;
    btn.innerHTML = 'Capturing…';
    btn.disabled = true;

    const target = document.querySelector('main.main');
    html2canvas(target, {
      backgroundColor: '#FAF9F0',
      scale: 2,
      useCORS: true,
      scrollY: -window.scrollY
    }).then(canvas => {
      const link = document.createElement('a');
      const date = new Date().toISOString().slice(0,10);
      link.download = `cook-planner-${date}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      btn.innerHTML = '✓ Saved!';
      setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 2000);
    }).catch(() => {
      btn.innerHTML = original;
      btn.disabled = false;
    });
  }

  // ─────────────────────────────────────────────
  // RESET
  // ─────────────────────────────────────────────
  async function confirmReset() {
    if (!confirm('Reset everything? This will delete all team members and projects.')) return;
    state = { team: [], projects: [] };
    save(); render();
  }

  // ─────────────────────────────────────────────
  // UTILS
  // ─────────────────────────────────────────────
  function esc(str) {
    return String(str)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ─────────────────────────────────────────────
  // INIT
  // ─────────────────────────────────────────────
  showLanding();
</script>

</body>
</html>
